{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Yellow Mango's{% endblock %}</title>
    
    <!-- Panggil Boxicons agar ikon minuman & sosmed muncul di semua halaman -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset Global agar font & margin sejajar presisi di semua halaman */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #FFFDF7;
            color: #1E293B;
        }

        .main-wrapper {
            flex: 1;
        }

        /* ================= CSS FOOTER PRESISI & KE TENGAH ================= */
        .footer-section {
            background-color: #f8f9fa;
            border-top: 1px solid #eaeaea;
            color: #222222;
            padding: 65px 20px 30px 20px;
            width: 100%;
        }

        .footer-container {
            max-width: 1120px; /* Dikecilkan dari 1250px agar lebih ke tengah */
            margin: 0 auto 45px auto;
            display: grid;
            /* Proporsi kolom diseimbangkan untuk 1 lokasi saja */
            grid-template-columns: 1.6fr 1fr 1fr 1.1fr 1.3fr;
            gap: 35px;
            align-items: start; /* Memastikan semua judul kolom sejajar atas */
        }

        .footer-col h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #111111;
            margin-top: 0;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .footer-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #111111;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        .footer-brand i {
            color: #e6a800;
            font-size: 1.6rem;
        }

        .footer-tagline {
            font-size: 0.9rem;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .footer-socials {
            display: flex;
            gap: 12px;
        }

        .footer-socials a {
            width: 36px;
            height: 36px;
            background-color: #111111;
            color: #FFC107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .footer-socials a:hover {
            background-color: #FFC107;
            color: #111111;
            transform: translateY(-2px);
        }

        .footer-col ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-col ul li {
            margin-bottom: 12px;
        }

        .footer-col ul li:last-child {
            margin-bottom: 0;
        }

        .footer-col ul li a {
            text-decoration: none;
            color: #555555;
            font-size: 0.92rem;
            transition: color 0.2s ease;
        }

        .footer-col ul li a:hover {
            color: #e6a800;
        }

        .footer-contact-info {
            font-size: 0.92rem;
            color: #555555;
            line-height: 1.7;
        }

        .footer-locations h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #111111;
            margin-bottom: 6px;
        }

        .footer-locations p {
            font-size: 0.9rem;
            color: #666666;
            line-height: 1.6;
        }

        .footer-bottom {
            max-width: 1120px;
            margin: 0 auto;
            border-top: 1px solid #e0e0e0;
            padding-top: 24px;
            text-align: center;
            font-size: 0.88rem;
            color: #777777;
        }

        @media (max-width: 992px) {
            .footer-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
            }
        }

        @media (max-width: 576px) {
            .footer-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        {% block content %}
        {% endblock %}
    </div>

    <!-- FOOTER GLOBAL -->
    {% include 'store/footer.html' %}
</body>
</html>
