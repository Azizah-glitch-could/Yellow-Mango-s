<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Mango's - Autentikasi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #F5EAB9; /* Vanilla */
            color: #254E06; /* Dark Moss Green */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            background-color: #FFFFFF;
            padding: 40px 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(37, 78, 6, 0.12);
            border: 2px solid #EAD465; /* Arylide Yellow */
        }
        .brand-badge {
            display: block;
            background-color: transparent; /* Menghilangkan background shape */
            color: #EAC800; /* Warna kuning Jonquil sesuai palet */
            font-size: 24px; /* Memperbesar ukuran huruf */
            font-weight: 800; /* Lebih tebal dan tegas */
            padding: 0;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .header-center {
            text-align: center;
        }
        .brand-title {
            color: #254E06;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }
        .brand-subtitle {
            color: #7E8407; /* Olive */
            font-size: 13px;
            margin: 0 0 24px 0;
        }
        
        /* Toggle Kapsul */
        .toggle-container {
            display: flex;
            background-color: #F5EAB9;
            border-radius: 30px;
            padding: 5px;
            margin-bottom: 24px;
            border: 1px solid #EAD465;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #7E8407;
            font-weight: 600;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .toggle-btn.active {
            background-color: #EAC800; /* Jonquil */
            color: #254E06;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(234, 200, 0, 0.35);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-group {
            margin-bottom: 15px;
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #254E06;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            background-color: #FAF6E9;
            border: 1.5px solid #EAD465;
            border-radius: 10px;
            color: #254E06;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .form-control::placeholder {
            color: #99A175;
        }
        .form-control:focus {
            background-color: #FFFFFF;
            border-color: #254E06;
            box-shadow: 0 0 0 3px rgba(37, 78, 6, 0.12);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: #254E06;
            color: #FFFFFF;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 6px 16px rgba(37, 78, 6, 0.25);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-submit:hover {
            background-color: #1b3804;
        }

        .error-msg {
            background-color: #FDEDED;
            color: #D32F2F;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 18px;
            text-align: center;
            border: 1px solid #F5C6CB;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #7E8407;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #EAD465;
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .alt-btn {
            width: 100%;
            padding: 11px;
            background-color: #FFFFFF;
            border: 1.5px solid #EAD465;
            border-radius: 10px;
            color: #254E06;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .alt-btn:hover {
            background-color: #F5EAB9;
            border-color: #254E06;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #EAD465;
        }
        .back-link a {
            color: #7E8407;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }
        .back-link a:hover {
            color: #254E06;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header-center">
            <span class="brand-badge">YELLOW MANGO'S</span>
            <h2 class="brand-title" id="form-title">Welcome Back</h2>
            <p class="brand-subtitle" id="form-subtitle">Login to access your account</p>
        </div>

        <!-- Toggle Kapsul -->
        <div class="toggle-container">
            <button type="button" class="toggle-btn {% if mode != 'signup' %}active{% endif %}" id="btn-login-tab" onclick="setMode('login')">Log In</button>
            <button type="button" class="toggle-btn {% if mode == 'signup' %}active{% endif %}" id="btn-signup-tab" onclick="setMode('signup')">Sign Up</button>
        </div>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" id="action-input" value="{{ mode|default:'login' }}">

            <!-- FIELD KHUSUS SIGN UP -->
            <div id="signup-fields" style="display: {% if mode == 'signup' %}block{% else %}none{% endif %};">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Nama depan">
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Nama belakang">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" class="form-control" placeholder="08xxxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label for="birth_date">Birth of Date</label>
                        <input type="date" id="birth_date" name="birth_date" class="form-control">
                    </div>
                </div>
            </div>

            <!-- FIELD UTAMA (Email untuk Login / Sign Up) -->
            <div class="form-group">
                <label for="username" id="username-label">Email</label>
                <input type="email" id="username" name="username" class="form-control" required placeholder="Masukkan Email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Masukkan password">
            </div>

            <!-- KONFIRMASI PASSWORD KHUSUS SIGN UP -->
            <div class="form-group" id="confirm-password-group" style="display: {% if mode == 'signup' %}block{% else %}none{% endif %};">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Ulangi password">
            </div>

            <button type="submit" class="btn-submit" id="submit-btn-text">
                {% if mode == 'signup' %}Sign Up{% else %}Log In{% endif %}
            </button>
        </form>

        <div class="divider" id="divider-text">Or Sign In With</div>
        <div class="alt-login-options" style="display: flex; gap: 12px;">
            <!-- Tombol Phone Number (Hanya muncul di Log In) -->
            <button type="button" class="alt-btn" id="phone-btn" onclick="alert('Fitur login via Phone Number segera hadir!')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#254E06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                <span>Phone Number</span>
            </button>

            <!-- Tombol Google (Muncul di Log In & Sign Up) -->
            <button type="button" class="alt-btn" id="google-btn" onclick="alert('Fitur autentikasi dengan Google segera hadir!')">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
                </svg>
                <span id="google-label">Google</span>
            </button>
        </div>

        <div class="back-link">
            <a href="{% url 'index' %}">&larr; Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        function setMode(mode) {
            const btnLoginTab = document.getElementById('btn-login-tab');
            const btnSignupTab = document.getElementById('btn-signup-tab');
            const actionInput = document.getElementById('action-input');
            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const submitBtnText = document.getElementById('submit-btn-text');
            const signupFields = document.getElementById('signup-fields');
            const confirmPasswordGroup = document.getElementById('confirm-password-group');
            const dividerText = document.getElementById('divider-text');
            const phoneBtn = document.getElementById('phone-btn');
            const googleLabel = document.getElementById('google-label');

            if (mode === 'signup') {
                btnSignupTab.classList.add('active');
                btnLoginTab.classList.remove('active');
                actionInput.value = 'signup';
                formTitle.textContent = 'Get Started Now';
                formSubtitle.textContent = 'Create an account to explore our menu';
                submitBtnText.textContent = 'Sign Up';
                signupFields.style.display = 'block';
                confirmPasswordGroup.style.display = 'block';
                dividerText.textContent = 'Or Sign Up With';
                phoneBtn.style.display = 'none';
                googleLabel.textContent = 'Sign Up with Google';
            } else {
                btnLoginTab.classList.add('active');
                btnSignupTab.classList.remove('active');
                actionInput.value = 'login';
                formTitle.textContent = 'Welcome Back';
                formSubtitle.textContent = 'Login to access your account';
                submitBtnText.textContent = 'Log In';
                signupFields.style.display = 'none';
                confirmPasswordGroup.style.display = 'none';
                dividerText.textContent = 'Or Sign In With';
                phoneBtn.style.display = 'flex';
                googleLabel.textContent = 'Google';
            }
        }

        // Menyesuaikan tampilan awal jika halaman dimuat langsung dalam mode signup
        window.addEventListener('DOMContentLoaded', () => {
            const currentMode = document.getElementById('action-input').value;
            setMode(currentMode);
        });
    </script>
</body>
</html>
