<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Mango's - Autentikasi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-container {
            background-color: #1a1a1a;
            padding: 45px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #2c2c2c;
        }
        .brand-title {
            text-align: center;
            color: #FFC107;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }
        .brand-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin: 0 0 28px 0;
        }
        
        /* Toggle Kapsul (Sign Up / Log In) */
        .toggle-container {
            display: flex;
            background-color: #262626;
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 28px;
            position: relative;
        }
        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .toggle-btn.active {
            background-color: #FFC107;
            color: #121212;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
        }
        .form-control {
            width: 100%;
            padding: 13px 16px;
            background-color: #242424;
            border: 1px solid #383838;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #FFC107;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: #FFC107;
            color: #121212;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-submit:hover {
            background-color: #ffca28;
        }

        .error-msg {
            background-color: rgba(255, 77, 77, 0.1);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        /* Divider & Social / Alternative Login */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #666;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .alt-login-options {
            display: flex;
            gap: 12px;
        }
        .alt-btn {
            flex: 1;
            padding: 11px;
            background-color: #242424;
            border: 1px solid #383838;
            border-radius: 10px;
            color: #ddd;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
            text-decoration: none;
        }
        .alt-btn:hover {
            background-color: #2f2f2f;
            border-color: #555;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        .back-link a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link a:hover {
            color: #FFC107;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 class="brand-title" id="form-title">Welcome Back</h2>
        <p class="brand-subtitle" id="form-subtitle">Login to access your account</p>

        <!-- Toggle Kapsul Atas -->
        <div class="toggle-container">
            <button type="button" class="toggle-btn {% if mode != 'signup' %}active{% endif %}" id="btn-login-tab" onclick="setMode('login')">Log In</button>
            <button type="button" class="toggle-btn {% if mode == 'signup' %}active{% endif %}" id="btn-signup-tab" onclick="setMode('signup')">Sign Up</button>
        </div>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" id="action-input" value="{{ mode|default:'login' }}">

            <div class="form-group" id="name-group" style="display: {% if mode == 'signup' %}block{% else %}none{% endif %};">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label for="username" id="username-label">Username / Email</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Masukkan username atau email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn-submit" id="submit-btn-text">
                {% if mode == 'signup' %}Sign Up{% else %}Log In{% endif %}
            </button>
        </form>

        <!-- Bagian Bawah: Opsi alternatif (Phone Number / Email) sesuai permintaan -->
        <div class="divider" id="divider-text">Or Sign In With</div>
        <div class="alt-login-options" id="alt-options">
            <button type="button" class="alt-btn" onclick="alert('Fitur login via Phone Number segera hadir!')">
                📱 Phone Number
            </button>
            <button type="button" class="alt-btn" onclick="alert('Fitur login via Google segera hadir!')">
                🌐 Google Email
            </button>
        </div>

        <div class="back-link">
            <a href="{% url 'index' %}">&larr; Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        function setMode(mode) {
            const btnLoginTab = document.getElementById('btn-login-tab');
            const btnSignupTab = document.getElementById('btn-signup-tab');
            const actionInput = document.getElementById('action-input');
            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const submitBtnText = document.getElementById('submit-btn-text');
            const nameGroup = document.getElementById('name-group');
            const dividerText = document.getElementById('divider-text');
            const altOptions = document.getElementById('alt-options');

            if (mode === 'signup') {
                btnSignupTab.classList.add('active');
                btnLoginTab.classList.remove('active');
                actionInput.value = 'signup';
                formTitle.textContent = 'Get Started Now';
                formSubtitle.textContent = 'Create an account to explore our app';
                submitBtnText.textContent = 'Sign Up';
                nameGroup.style.display = 'block';
                dividerText.textContent = 'Or Sign Up With';
            } else {
                btnLoginTab.classList.add('active');
                btnSignupTab.classList.remove('active');
                actionInput.value = 'login';
                formTitle.textContent = 'Welcome Back';
                formSubtitle.textContent = 'Login to access your account';
                submitBtnText.textContent = 'Log In';
                nameGroup.style.display = 'none';
                dividerText.textContent = 'Or Sign In With';
            }
        }
    </script>
</body>
</html>
