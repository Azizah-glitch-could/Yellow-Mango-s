{% extends 'base.html' %}

{% block content %}
<div style="max-width: 900px; margin: 60px auto; padding: 0 20px; min-height: 50vh;">
    <h1 style="font-size: 2.2rem; font-weight: 800; color: #254E06; margin-bottom: 12px;">{{ page.title }}</h1>
    <div style="width: 60px; height: 4px; background: #EAC800; border-radius: 2px; margin-bottom: 30px;"></div>
    <div style="font-size: 1.02rem; line-height: 1.8; color: #333333;">
        {{ page.content|linebreaks }}
    </div>
</div>
{% endblock %}
